<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Friday — Плюшки для учнів</title>

<link rel="icon" type="image/svg+xml" href="https://logikaschool.com/wp-content/uploads/2026/07/logika-logo.svg">

<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  :root{
    --orange:#ff7a00;
    --orange-light:#ff9d00;
    --purple:#8b5cf6;
    --purple-light:#a78bfa;
    --text-muted:#a1a1b5;
  }

  html, body{height:100%;}
  body{
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% -10%, #2a1a3a 0%, #0f0a18 45%, #050507 100%);
    color:#fff;
    font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:52px 16px 72px;
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(110px);
    opacity:.32;
    pointer-events:none;
    z-index:0;
  }
  .blob.a{width:520px;height:520px;background:var(--orange);top:-200px;left:-180px;animation:float1 14s ease-in-out infinite;}
  .blob.b{width:460px;height:460px;background:var(--purple);bottom:-200px;right:-160px;animation:float2 17s ease-in-out infinite;}
  .blob.c{width:380px;height:380px;background:var(--orange-light);top:40%;left:55%;animation:float1 20s ease-in-out infinite reverse;opacity:.16;}

  @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(60px,50px) scale(1.15);}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-70px,-40px) scale(1.1);}}

  .loader-logo,
  .loader-mascot{
    position:fixed;
    z-index:55;
    pointer-events:none;
    opacity:0;
    transition:
      opacity .6s ease,
      top 1.15s cubic-bezier(.65,0,.35,1),
      left 1.15s cubic-bezier(.65,0,.35,1),
      margin 1.15s cubic-bezier(.65,0,.35,1),
      transform 1.15s cubic-bezier(.65,0,.35,1);
    will-change: top, left, transform, opacity;
  }

  .loader-logo{
    top:50%;left:50%;margin-top:-100px;
    transform:translate(-50%,-50%) scale(1.8);
    transform-origin:center center;
  }
  .loader-logo img{
    height:42px;display:block;
    filter:drop-shadow(0 0 24px rgba(139,92,246,.55));
  }

  .loader-mascot{
    top:50%;left:50%;margin-top:120px;
    transform:translate(-50%,-50%) scale(1.4);
    transform-origin:center center;
  }
  .loader-mascot img{
    width:160px;display:block;
    filter:drop-shadow(0 8px 30px rgba(255,122,0,.5));
  }

  @keyframes loadingPulse{
    0%,100%{filter:drop-shadow(0 0 24px rgba(139,92,246,.55));}
    50%{filter:drop-shadow(0 0 44px rgba(255,122,0,.85));}
  }
  @keyframes loadingPulseM{
    0%,100%{filter:drop-shadow(0 8px 30px rgba(255,122,0,.5));}
    50%{filter:drop-shadow(0 10px 44px rgba(139,92,246,.8));}
  }
  body.intro:not(.loaded) .loader-logo img{animation:loadingPulse 1.8s ease-in-out infinite;}
  body.intro:not(.loaded) .loader-mascot img{animation:loadingPulseM 1.8s ease-in-out infinite;}

  body.intro .loader-logo,
  body.intro .loader-mascot{opacity:1;}

  body.loaded .loader-logo{
    top:12px;left:16px;margin-top:0;
    transform:translate(0,0) scale(.75);
    transform-origin:top left;
  }
  body.loaded .loader-mascot{
    top:auto;left:auto;margin-top:0;
    bottom:6px;right:10px;
    transform:scale(.42);
    transform-origin:bottom right;
    opacity:.9;
  }

  .hero{
    position:relative;z-index:2;text-align:center;
    max-width:760px;margin-bottom:10px;flex-shrink:0;
  }

  .hero-content{
    opacity:0;transform:translateY(18px);
    transition:opacity .7s ease .2s, transform .7s cubic-bezier(.4,0,.2,1) .2s;
  }
  body.loaded .hero-content{opacity:1;transform:translateY(0);}

  .tag{
    display:inline-block;padding:5px 16px;border-radius:999px;
    background:linear-gradient(90deg,var(--orange),var(--purple));
    font-weight:900;font-size:.66rem;letter-spacing:2.5px;
    box-shadow:0 0 22px rgba(255,122,0,.55);
    animation:pulseTag 2.2s ease-in-out infinite;
  }
  @keyframes pulseTag{0%,100%{box-shadow:0 0 18px rgba(255,122,0,.4);}50%{box-shadow:0 0 36px rgba(139,92,246,.8);}}

  h1{
    margin:8px 0 4px;
    font-size:clamp(1.3rem, 4.5vw, 2.4rem);
    font-weight:900;line-height:1.02;letter-spacing:-1px;
    background:linear-gradient(180deg,#fff 0%,var(--orange-light) 45%,var(--orange) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(255,122,0,.4));
  }
  h1 span{
    background:linear-gradient(180deg,var(--purple-light),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(139,92,246,.5));
  }

  .sub{
    color:var(--text-muted);
    font-size:clamp(.72rem, 1.6vw, .92rem);
    font-weight:500;margin-top:2px;
  }
  .sub b{color:var(--orange-light);}

  .stripe{
    margin-top:8px;padding:5px 12px;border-radius:10px;
    background:repeating-linear-gradient(45deg,var(--orange) 0 12px,#111 12px 24px);
    color:#111;font-weight:900;font-size:.6rem;letter-spacing:2px;
    text-shadow:0 0 6px var(--orange);
    display:inline-block;
    box-shadow:0 0 24px rgba(255,122,0,.25);
  }
  .stripe span{background:var(--orange);padding:2px 10px;border-radius:6px;}

  .board{
    position:relative;z-index:2;
    flex:1 1 auto;min-height:0;
    width:100%;max-width:1200px;
    display:grid;
    grid-template-columns:repeat(5, minmax(0,1fr));
    grid-template-rows:repeat(4, minmax(0,1fr));
    gap:10px;
  }

  .card{
    position:relative;min-width:0;min-height:0;
    perspective:1200px;background:none;border:none;padding:0;
    cursor:pointer;font-family:inherit;
    animation:cardIn .55s cubic-bezier(.2,.9,.3,1.4) both;
    transition:opacity .4s, filter .4s;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.88);}to{opacity:1;transform:none;}}

  .card-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .85s cubic-bezier(.2,.8,.2,1);
  }

  .card:not(.flipped):hover .card-inner{transform:translateY(-5px) rotateX(6deg) scale(1.02);}
  .card.flipped .card-inner{transform:rotateY(180deg);}

  .face{
    position:absolute;inset:0;border-radius:14px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;padding:8px 6px;text-align:center;overflow:hidden;
  }

  .front{
    background:linear-gradient(160deg,#1a1228 0%,#0c0812 70%);
    border:2px solid rgba(255,122,0,.35);
    box-shadow:0 0 20px rgba(255,122,0,.08), inset 0 0 30px rgba(139,92,246,.06);
  }
  .front::after{
    content:'';position:absolute;
    top:-60%;left:-160%;width:55%;height:220%;
    background:linear-gradient(90deg,transparent,rgba(255,122,0,.3),transparent);
    transform:rotate(22deg);
    animation:shine 3.6s infinite;
  }
  @keyframes shine{0%{left:-160%;}55%,100%{left:170%;}}

  .num{
    font-size:clamp(1.1rem, 3.2vmin, 2rem);
    font-weight:900;line-height:1;
    background:linear-gradient(180deg,#fff,var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 12px rgba(255,122,0,.5));
  }
  .q{font-size:clamp(.6rem, 1.5vmin, .85rem);font-weight:800;color:#7a6a8a;letter-spacing:3px;}
  .hint{
    position:absolute;bottom:6px;
    font-size:.5rem;font-weight:800;letter-spacing:2px;color:#6a5a7a;
  }

  .back{
    transform:rotateY(180deg);
    background:linear-gradient(160deg,var(--orange-light) 0%,var(--orange) 40%,var(--purple) 100%);
    border:2px solid #ffe0c0;
    color:#120800;
    box-shadow:0 0 40px rgba(255,122,0,.55);
    padding:8px 6px 28px;
  }
  .back .icon{
    font-size:clamp(1rem, 3vmin, 1.7rem);
    line-height:1;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
  }
  .back .ptitle{
    font-weight:900;
    font-size:clamp(.55rem, 1.4vmin, .82rem);
    line-height:1.15;letter-spacing:.1px;
    word-break:break-word;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .reserved-on-card{
    position:absolute;
    bottom:4px;left:4px;right:4px;
    padding:3px 5px;
    background:rgba(0,0,0,.55);
    border-radius:7px;
    display:flex;flex-direction:column;align-items:center;
    gap:1px;
    line-height:1;
    opacity:0;
    transition:opacity .35s ease .15s;
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    border:1px solid rgba(255,224,102,.35);
  }
  .card.picked .reserved-on-card{opacity:1;}

  .reserved-small{
    font-size:clamp(.32rem, .75vmin, .48rem);
    color:rgba(255,255,255,.7);
    letter-spacing:.5px;
    text-transform:uppercase;
    font-weight:700;
    white-space:nowrap;
  }
  .reserved-small-name{
    font-size:clamp(.52rem, 1.3vmin, .78rem);
    color:#ffe066;
    font-weight:900;
    margin-top:1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }

  .card.picked{cursor:default;filter:drop-shadow(0 0 26px rgba(255,122,0,.55));}
  .card.picked .front::after{display:none;}

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px) rotate(-1.5deg);}
    40%{transform:translateX(6px) rotate(1.5deg);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  .card.shake{animation:shake .45s;}

  .controls{
    position:relative;z-index:2;margin-top:10px;
    display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
    flex-shrink:0;
    opacity:0;transform:translateY(12px);
    transition:opacity .6s ease .4s, transform .6s ease .4s;
  }
  body.loaded .controls{opacity:1;transform:translateY(0);}

  .btn{
    font-family:inherit;font-weight:900;font-size:.85rem;letter-spacing:1px;
    padding:11px 26px;border-radius:12px;border:none;cursor:pointer;
    transition:transform .18s, box-shadow .18s, background .18s;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--orange),var(--purple));
    color:#fff;
    box-shadow:0 6px 24px rgba(139,92,246,.4);
  }
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,122,0,.6);}
  .btn.primary:active{transform:translateY(0) scale(.97);}

  .btn.ghost{
    background:rgba(255,255,255,.06);
    color:#ddd;
    border:1.5px solid rgba(255,255,255,.16);
  }
  .btn.ghost:hover{background:rgba(255,255,255,.12);transform:translateY(-2px);}

  .modal{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;
    padding:22px;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .modal.show{opacity:1;pointer-events:auto;}

  .modal-card{
    position:relative;width:100%;max-width:430px;
    max-height:90vh;overflow-y:auto;
    padding:34px 26px 28px;border-radius:24px;text-align:center;
    background:linear-gradient(160deg,#1a1228,#09060f);
    border:2px solid rgba(139,92,246,.5);
    box-shadow:0 0 80px rgba(139,92,246,.3), inset 0 0 60px rgba(255,122,0,.05);
    transform:scale(.82) translateY(26px);
    transition:transform .45s cubic-bezier(.2,.9,.3,1.45);
  }
  .modal.show .modal-card{transform:scale(1) translateY(0);}

  .modal-icon{
    font-size:3.2rem;line-height:1;margin-bottom:12px;
    filter:drop-shadow(0 0 20px rgba(255,122,0,.6));
    animation:pop 1.6s ease-in-out infinite;
  }
  @keyframes pop{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  .modal-label{
    font-size:.65rem;letter-spacing:4px;font-weight:900;
    color:var(--orange-light);margin-bottom:10px;
  }
  .modal-card h2{
    font-size:clamp(1.2rem,4.5vw,1.6rem);font-weight:900;line-height:1.15;
    margin-bottom:12px;
    background:linear-gradient(180deg,#fff,var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .modal-card p{color:var(--text-muted);font-size:.9rem;line-height:1.5;margin-bottom:22px;}

  /* ---- МОДАЛКА ІМЕНІ ---- */
  .name-card h2{
    font-size:clamp(1.2rem, 4.5vw, 1.55rem);
  }
  .name-card p{
    margin-bottom:16px;
  }
  .name-input{
    width:100%;
    padding:14px 18px;
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    color:#fff;
    background:rgba(255,255,255,.06);
    border:2px solid rgba(139,92,246,.4);
    border-radius:12px;
    outline:none;
    text-align:center;
    transition:border-color .2s, background .2s, box-shadow .2s;
    margin-bottom:16px;
    -webkit-appearance:none;
    appearance:none;
  }
  .name-input::placeholder{
    color:#7a6a8a;
    font-weight:500;
  }
  .name-input:focus{
    border-color:var(--orange);
    background:rgba(255,122,0,.08);
    box-shadow:0 0 24px rgba(255,122,0,.28);
  }
  .name-input.shake{animation:shake .45s;}

  .name-actions{
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .name-actions .btn{
    flex:1;
    padding:12px 14px;
    font-size:.82rem;
  }

  /* ---- БЕЙДЖ У РЕЗУЛЬТАТІ ---- */
  .reserved-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:999px;
    background:rgba(255,122,0,.12);
    border:1.5px solid rgba(255,122,0,.4);
    margin-bottom:22px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:100%;
  }
  .reserved-label{
    font-size:.65rem;
    color:var(--text-muted);
    letter-spacing:1.2px;
    text-transform:uppercase;
    font-weight:800;
  }
  .reserved-name{
    font-size:.95rem;
    font-weight:900;
    color:var(--orange-light);
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .confetti{
    position:fixed;top:-30px;z-index:100;pointer-events:none;border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{to{transform:translateY(112vh) rotate(900deg);opacity:.9;}}

  @media(max-width:900px){
    .board{grid-template-columns:repeat(5, minmax(0,1fr));grid-template-rows:repeat(4, minmax(0,1fr));gap:8px;}
  }
  @media(max-width:640px){
    body{padding:44px 10px 60px;}
    .board{grid-template-columns:repeat(4, minmax(0,1fr));grid-template-rows:repeat(5, minmax(0,1fr));gap:6px;}
    .hint{display:none;}
    .back .ptitle{-webkit-line-clamp:3;}
  }
  @media(max-height:700px){
    body{padding:36px 12px 54px;}
    .sub{display:none;}
    h1{font-size:clamp(1.1rem, 3.5vw, 1.6rem);margin:4px 0 2px;}
    .tag{font-size:.55rem;padding:3px 10px;}
    .stripe{font-size:.55rem;padding:4px 10px;margin-top:6px;}
    .hero{margin-bottom:6px;}
  }
</style>
</head>
<body>

  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>

  <div class="loader-logo">
    <img src="https://logikaschool.com/wp-content/uploads/2026/07/logika-logo.svg" alt="Logika School">
  </div>

  <div class="loader-mascot">
    <img src="https://logikaschool.com/wp-content/themes/logika-theme/assets/img/cta/cta-icon.svg" alt="Маскоти Logika School">
  </div>

  <header class="hero">
    <div class="hero-content">
      <div class="tag">⚡ BLACK FRIDAY ⚡</div>
      <h1>ЧОРНА П'ЯТНИЦЯ<br><span>ЛОГІКІВ</span></h1>
      <p class="sub">Тягни картки, скільки хочеш — <b>кожна</b> приносить плюшку!</p>
      <div class="stripe"><span>ВИГРАЄ КОЖЕН</span></div>
    </div>
  </header>

  <main class="board" id="board"></main>

  <div class="controls">
    <button class="btn primary" id="reset">🔄 Нова роздача</button>
  </div>

  <!-- МОДАЛКА РЕЗУЛЬТАТУ -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-icon" id="mIcon">🎁</div>
      <div class="modal-label">ТВОЯ ПЛЮШКА</div>
      <h2 id="mTitle">—</h2>
      <p id="mDesc">—</p>
      <div class="reserved-badge">
        <span class="reserved-label">🎫 Заброньована за</span>
        <span class="reserved-name" id="mName">—</span>
      </div>
      <button class="btn primary" id="mClose">Далі 🎁</button>
    </div>
  </div>

  <!-- МОДАЛКА ІМЕНІ -->
  <div class="modal" id="nameModal">
    <div class="modal-card name-card">
      <div class="modal-icon">✍️</div>
      <div class="modal-label">ХТО ТЯГНЕ?</div>
      <h2>Введи своє ім'я</h2>
      <p>Щоб забронювати цю плюшку саме за тобою</p>
      <input type="text" id="nameInput" class="name-input"
             placeholder="Твоє ім'я..." maxlength="24" autocomplete="off">
      <div class="name-actions">
        <button class="btn ghost" id="nameCancel">Скасувати</button>
        <button class="btn primary" id="nameConfirm">Тягнути 🎁</button>
      </div>
    </div>
  </div>

<script>
/* ================= ДАНІ (20 карток) ================= */
const PERKS = [
  { icon:'🧠', title:'+3 логіки',
    desc:'Три логіки падають прямо в твою скарбничку. Просто так. Безкоштовно. З любов`ю.' },
  { icon:'🔁', title:'Повторний шанс',
    desc:'Якщо щось пішло не так — можеш спробувати ще раз. Один раз. Але це вже багато!' },
  { icon:'💰', title:'+3 логіки',
    desc:'Три логіки — приємний бонус. Небагато, але завжди доречно.' },
  { icon:'💰', title:'+3 логіки',
    desc:'Ще три логіки! Чудовий день, щоб трохи заробити.' },
  { icon:'💰', title:'+3 логіки',
    desc:'І знову +3! Логіки самі пливуть до тебе.' },
  { icon:'🪙', title:'+1 логік',
    desc:'Один логік — маленька, але приємна монетка у скарбничку.' },
  { icon:'🪙', title:'+1 логік',
    desc:'І ще один логік! Небагато, але ж приємно.' },
  { icon:'✖️2', title:'Подвійні логіки за роботу на уроці',
    desc:'Усі логіки, які ти заробиш на цьому уроці, автоматично подвоюються. Працюй — і багатій.' },
  { icon:'🎉', title:'Звільнення від дз',
    desc:'Один урок — без домашнього завдання. Але логіки за нього все одно отримаєш. Магія? Ні, Чорна П`ятниця.' },
  { icon:'⏱️', title:'+5 хв перерви',
    desc:'П`ять додаткових хвилин перерви. Абсолютно законно. Підтверджено Чорною П`ятницею.' },
  { icon:'😈', title:'Викладач робить одне завдання замість мене',
    desc:'Так, серйозно. Обирай завдання — і дивись, як вчитель його виконує. Насолоджуйся моментом.' },
  { icon:'🎲', title:'Ще дві спроби, щоб витягнути плюшку',
    desc:'Не сподобалась плюшка? Витягни ще дві! Максимальна наглість схвалена адміністрацією.' },
  { icon:'👑', title:'Король перерви',
    desc:'Ти сьогодні — монарх перерви. Вирішуй, як клас проведе ці хвилини. Твоє слово — закон!' },
  { icon:'🎵', title:'Пісня для всіх',
    desc:'Перерва з твоїм саундтреком! Обери трек, попередь вчителя — і весь клас слухає твій музичний смак.' },
  { icon:'🧑‍🏫', title:'Асистент викладача',
    desc:'Сьогодні ти — права рука вчителя. Виставляй логіки за активність — в межах правил, без свавілля!' },
  { icon:'📝', title:'Завдання для вчителя',
    desc:'Одне завдання для дорослого. Тільки пожалій, добре?' },
  { icon:'💌', title:'Таємна записка',
    desc:'Конфіденційний лист від вчителя: чому саме ти сьогодні — суперзірка. Читаєш — і сяєш.' },
  { icon:'📋', title:'Дубль',
    desc:'Сподобався приз одногрупника? Тепер він у тебе теж. Дублюй — і насолоджуйся.' },
  { icon:'🙊', title:'Без питань',
    desc:'Офіційний імунітет! Одне питання від викладача пролітає повз тебе. Ідеально для відкритого уроку.' },
  { icon:'⭐', title:'Особливий',
    desc:'VIP-статус на відкритому уроці. Обирай, коли показувати проект — першим, останнім чи взагалі без черги.' }
];

/* ================= СТАН ================= */
const board     = document.getElementById('board');
const modal     = document.getElementById('modal');
const mIcon     = document.getElementById('mIcon');
const mTitle    = document.getElementById('mTitle');
const mDesc     = document.getElementById('mDesc');
const mName     = document.getElementById('mName');
const nameModal = document.getElementById('nameModal');
const nameInput = document.getElementById('nameInput');

let pendingCard  = null;
let pendingPerk  = null;
let lastUsedName = '';

/* ---- відновлюємо останнє імʼя з localStorage ---- */
try{
  const saved = localStorage.getItem('bf_lastName');
  if (saved) lastUsedName = saved;
}catch(e){ /* localStorage може бути недоступним */ }

/* ================= УТИЛІТИ ================= */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function confetti(){
  const colors = ['#ff7a00','#8b5cf6','#ffffff','#ff9d00','#a78bfa','#000000'];
  for (let i = 0; i < 80; i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (9 + Math.random() * 11) + 'px';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    el.style.animationDuration = (1.9 + Math.random() * 1.4) + 's';
    el.style.opacity = 0.85 + Math.random() * 0.15;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
}

/* ================= РЕНДЕР ================= */
function render(){
  board.innerHTML = '';

  const order = shuffle(PERKS);

  order.forEach((perk, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    card.type = 'button';
    card.style.animationDelay = (i * 0.035) + 's';
    card.setAttribute('aria-label', 'Картка номер ' + (i + 1));

    card.innerHTML = `
      <div class="card-inner">
        <div class="face front">
          <span class="num">${i + 1}</span>
          <span class="q">???</span>
          <span class="hint">ТЯГНИ</span>
        </div>
        <div class="face back">
          <span class="icon">${perk.icon}</span>
          <span class="ptitle">${perk.title}</span>
          <div class="reserved-on-card">
            <span class="reserved-small">Заброньована за</span>
            <span class="reserved-small-name"></span>
          </div>
        </div>
      </div>`;

    card.addEventListener('click', () => pick(card, perk));
    board.appendChild(card);
  });
}

/* ================= ВИБІР ================= */
function pick(card, perk){
  if (card.classList.contains('picked')){
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    return;
  }

  pendingCard = card;
  pendingPerk = perk;

  /* підставляємо попереднє імʼя (якщо є) */
  nameInput.value = lastUsedName;

  nameModal.classList.add('show');

  setTimeout(() => {
    nameInput.focus();
    /* виділяємо весь текст, щоб нове ім'я одразу замінило старе */
    if (nameInput.value) nameInput.select();
  }, 350);
}

/* ================= ПІДТВЕРДЖЕННЯ ІМЕНІ ================= */
function confirmName(){
  const name = nameInput.value.trim();

  if (!name){
    nameInput.classList.remove('shake');
    void nameInput.offsetWidth;
    nameInput.classList.add('shake');
    nameInput.focus();
    return;
  }

  lastUsedName = name;
  try{ localStorage.setItem('bf_lastName', name); }catch(e){}

  nameModal.classList.remove('show');

  const card = pendingCard;
  const perk = pendingPerk;
  pendingCard = null;
  pendingPerk = null;

  if (!card || !perk) return;

  card.querySelector('.reserved-small-name').textContent = name;

  card.classList.add('flipped', 'picked');

  confetti();
  setTimeout(() => confetti(), 400);

  setTimeout(() => showResult(perk, name), 780);
}

/* ================= СКАСУВАННЯ ================= */
function cancelName(){
  nameModal.classList.remove('show');
  pendingCard = null;
  pendingPerk = null;
}

/* ================= МОДАЛКА РЕЗУЛЬТАТУ ================= */
function showResult(perk, name){
  mIcon.textContent  = perk.icon;
  mTitle.textContent = perk.title;
  mDesc.textContent  = perk.desc;
  mName.textContent  = name;
  modal.classList.add('show');
}

/* ================= ПОДІЇ ================= */
document.getElementById('nameConfirm').addEventListener('click', confirmName);
document.getElementById('nameCancel').addEventListener('click', cancelName);

nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); confirmName(); }
});

document.getElementById('mClose').addEventListener('click', () => {
  modal.classList.remove('show');
});

modal.addEventListener('click', e => {
  if (e.target === modal) modal.classList.remove('show');
});

nameModal.addEventListener('click', e => {
  if (e.target === nameModal) cancelName();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;

  if (nameModal.classList.contains('show')){
    cancelName();
  } else if (modal.classList.contains('show')){
    modal.classList.remove('show');
  }
});

/* ================= КНОПКА СКИДАННЯ ================= */
document.getElementById('reset').addEventListener('click', () => {
  modal.classList.remove('show');
  nameModal.classList.remove('show');
  pendingCard = null;
  pendingPerk = null;
  render();
});

/* ================= ІНТРО ================= */
function startIntro(){
  document.body.classList.add('intro');
  setTimeout(() => {
    document.body.classList.add('loaded');
    setTimeout(render, 700);
  }, 1500);
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', startIntro);
} else {
  startIntro();
}
</script>
</body>
</html>
